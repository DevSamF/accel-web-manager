<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Accel-PPP Web Manager"
    />
    <title>Accel-PPP Web Manager</title>
    <script>
      // apply the saved theme before paint to avoid a flash of the light theme
      (function () {
        var theme = 'light';
        try {
          theme = localStorage.getItem('accel-theme') === 'synthwave' ? 'synthwave' : 'light';
        } catch (_) {
          // Storage may be disabled; the page can still use the default theme.
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
